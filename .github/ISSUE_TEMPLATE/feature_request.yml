name: 功能建议
description: 提出一个新功能或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 请描述使用场景与痛点，而不是直接给出实现方案
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否考虑过其他做法

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已查阅 README 的「已知限制与路线图」，确认该功能尚未在计划中
          required: true
