name: Bug 报告
description: 报告一个缺陷
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述遇到的问题
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 添加目录 ...
        2. 在搜索框输入 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PixMind 版本
      placeholder: v1.0.0 或 commit hash
    validations:
      required: true

  - type: dropdown
    id: models
    attributes:
      label: CLIP 模型是否已就绪
      description: models/ 目录下四个文件是否齐全
      options:
        - 已下载且齐全
        - 未下载 / 不完整
        - 不确定
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错信息
      description: 开发者工具 Console 或终端中的错误输出
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已查阅 README 的常见问题章节
          required: true
        - label: 我已搜索过现有 Issue，确认这不是重复问题
          required: true
